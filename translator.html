<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Translator</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --border: #ececec;
    --text: #111111;
    --muted: #8a8a8a;
    --faded: #c9c9c9;
    --accent: #111111;
    --accent-text: #ffffff;
  }
  :root[data-theme="dark"] {
    --bg: #0e0e0f;
    --panel: #141416;
    --border: #26262a;
    --text: #f2f2f3;
    --muted: #8a8a90;
    --faded: #3a3a3f;
    --accent: #f2f2f3;
    --accent-text: #0e0e0f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    transition: background .2s ease, color .2s ease;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .title { font-size: 14px; font-weight: 500; letter-spacing: .3px; color: var(--muted); }
  .spacer { flex: 1; }
  button, select {
    font: inherit; font-size: 13px;
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--text);
    cursor: pointer; transition: all .15s ease;
  }
  button:hover, select:hover { border-color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.primary:hover { opacity: .85; }
  button.stop { background: #dc2626; color: #fff; border-color: #dc2626; }
  button.stop:hover { background: #b91c1c; border-color: #b91c1c; opacity: 1; }
  button.icon { padding: 8px 10px; width: 36px; height: 36px; display: inline-flex;
    align-items: center; justify-content: center; }
  .control {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
  }
  .control input[type="checkbox"] { accent-color: var(--text); }

  main {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr;
    min-height: 0;
  }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .col + .col { border-top: 1px solid var(--border); border-left: 0 !important; }
  }
  .col {
    display: flex; flex-direction: column;
    padding: 32px 40px; min-height: 0;
    overflow: hidden;
  }
  .col + .col { border-left: 1px solid var(--border); }
  .col-label {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 24px; font-weight: 500;
  }
  .transcript {
    flex: 1; overflow-y: auto;
    font-size: 20px; line-height: 1.75;
    scrollbar-width: thin;
  }
  .transcript::-webkit-scrollbar { width: 6px; }
  .transcript::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .para { margin: 0 0 20px 0; transition: opacity 1.5s ease; }
  .para.fading { opacity: 0; }
  .para.gone { display: none; }
  .interim { color: var(--muted); font-style: italic; }
  .empty { color: var(--muted); font-size: 15px; font-style: italic;
    display: flex; align-items: center; gap: 10px; opacity: .7; }
  .empty .mic {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted); opacity: .6;
  }
  .empty.live .mic { background: #22c55e; opacity: 1; animation: pulse 1.6s infinite; }
  .status-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--faded); margin-right: 6px;
  }
  .status-dot.live { background: #22c55e; animation: pulse 1.6s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: .35; }
  }
  footer {
    padding: 10px 28px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted); text-align: center;
  }
  .error {
    padding: 10px 16px; margin: 0 28px 10px; border-radius: 8px;
    background: #fef2f2; color: #991b1b; font-size: 13px; display: none;
  }
  :root[data-theme="dark"] .error { background: #2a1414; color: #fca5a5; }
  .error.show { display: block; }
</style>
</head>
<body>
  <header>
    <span class="title" id="statusWrap" style="opacity:0;transition:opacity .2s;"><span id="dot" class="status-dot"></span><span id="statusText">Listening</span></span>
    <div class="spacer"></div>
    <label class="control"><input type="checkbox" id="ttsToggle" checked> Read aloud in English</label>
    <select id="voiceSelect" title="English voice"></select>
    <button id="clearBtn">Clear</button>
    <button id="toggleBtn" class="primary">
      <span id="btnIcon" style="display:inline-flex;align-items:center;gap:6px;">
        <svg id="btnSvg" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
        <span id="btnLabel">Start</span>
      </span>
    </button>
    <button id="themeBtn" class="icon" title="Toggle theme" aria-label="Toggle theme">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>
  </header>

  <div id="error" class="error"></div>

  <main>
    <section class="col">
      <div class="col-label">Italiano</div>
      <div id="itText" class="transcript">
        <div id="itEmpty" class="empty"><span class="mic"></span>Press Start to begin listening</div>
      </div>
    </section>
    <section class="col">
      <div class="col-label">English</div>
      <div id="enText" class="transcript"></div>
    </section>
  </main>

  <footer>Chrome / Edge · needs internet · text fades after 2 minutes</footer>

<script>
// ----- Theme -----
const themeBtn = document.getElementById('themeBtn');
const root = document.documentElement;
const saved = (() => { try { return localStorage.getItem('theme'); } catch(_) { return null; }})();
if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
  root.setAttribute('data-theme', 'dark');
}
themeBtn.addEventListener('click', () => {
  const dark = root.getAttribute('data-theme') === 'dark';
  if (dark) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', 'dark');
  try { localStorage.setItem('theme', dark ? 'light' : 'dark'); } catch(_) {}
});

// ----- Elements -----
const toggleBtn = document.getElementById('toggleBtn');
const clearBtn = document.getElementById('clearBtn');
const itText = document.getElementById('itText');
const enText = document.getElementById('enText');
const statusText = document.getElementById('statusText');
const dot = document.getElementById('dot');
const errorBox = document.getElementById('error');
const ttsToggle = document.getElementById('ttsToggle');
const voiceSelect = document.getElementById('voiceSelect');

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  showError("This browser doesn't support speech recognition. Use Chrome or Edge.");
  toggleBtn.disabled = true;
}

function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('show'); }
function clearError() { errorBox.classList.remove('show'); }
const statusWrap = document.getElementById('statusWrap');
function setStatus(text, live) {
  statusText.textContent = text;
  dot.classList.toggle('live', !!live);
  statusWrap.style.opacity = text ? '1' : '0';
}

// ----- Voices -----
let englishVoices = [];
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|pipe organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|fred|kathy|vicki|victoria|agnes|bruce|princess|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley/i;

// Score voices higher when they are modern neural / natural variants.
// Highest priority: explicitly labeled "Natural" / "Neural" / "Online"
// (Microsoft Edge ships free neural voices like "Microsoft Aria Online (Natural)";
// iOS Safari ships "Siri" voices; Chrome ships network-based "Google …" voices).
function voiceScore(v) {
  const n = v.name;
  let s = 0;
  if (/\bnatural\b/i.test(n)) s += 100;
  if (/\bneural\b/i.test(n)) s += 100;
  if (/\bonline\b/i.test(n)) s += 50;
  if (/\bsiri\b/i.test(n)) s += 80;
  if (/\bgoogle\b/i.test(n)) s += 40;
  if (/\benhanced\b/i.test(n)) s += 30;
  if (/\bpremium\b/i.test(n)) s += 30;
  if (/microsoft/i.test(n)) s += 10;
  // Known pleasant default voices across platforms
  if (/\b(samantha|ava|aria|jenny|libby|natasha|guy|alex|daniel|karen|moira|tessa|serena)\b/i.test(n)) s += 20;
  // Prefer en-US / en-GB over regional dialects for a general audience
  const lang = v.lang.toLowerCase();
  if (lang === 'en-us') s += 5;
  else if (lang === 'en-gb') s += 3;
  // localService voices are offline/robotic on most platforms — prefer non-local
  if (v.localService === false) s += 15;
  return s;
}

// A voice is "real" only if it is clearly a modern neural/natural voice,
// or a known high-quality named voice (Siri/Samantha/Ava/Aria/etc).
function isRealVoice(v) {
  const n = v.name;
  if (NOVELTY.test(n)) return false;
  if (/\b(natural|neural|online|enhanced|premium|siri)\b/i.test(n)) return true;
  if (/\bgoogle\b/i.test(n)) return true;
  if (/\b(samantha|ava|aria|jenny|libby|natasha|guy|alex|daniel|karen|moira|tessa|serena|zira|david|mark|hazel|susan|catherine|james|linda|richard|george)\b/i.test(n)) return true;
  return false;
}

function loadVoices() {
  const all = speechSynthesis.getVoices();
  englishVoices = all
    .filter(v => v.lang.toLowerCase().startsWith('en'))
    .filter(isRealVoice)
    .sort((a, b) => voiceScore(b) - voiceScore(a));
  voiceSelect.innerHTML = '';
  englishVoices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    const tag = voiceScore(v) >= 50 ? ' ★' : '';
    opt.textContent = v.name + tag;
    voiceSelect.appendChild(opt);
  });
  voiceSelect.value = 0;
}
loadVoices();
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text) {
  if (!ttsToggle.checked || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  const idx = parseInt(voiceSelect.value, 10);
  if (englishVoices[idx]) u.voice = englishVoices[idx];
  u.rate = 1.05;
  speechSynthesis.speak(u);
}

// ----- Transcript lifecycle (2-minute fade) -----
const FADE_MS = 2 * 60 * 1000;

function addParagraph(container, text, interim) {
  const emptyEl = container.querySelector('.empty');
  if (emptyEl) emptyEl.remove();
  const p = document.createElement('p');
  p.className = 'para' + (interim ? ' interim' : '');
  p.textContent = text;
  container.appendChild(p);
  container.scrollTop = container.scrollHeight;
  if (!interim) scheduleFade(p);
  return p;
}

function scheduleFade(el) {
  setTimeout(() => {
    el.classList.add('fading');
    setTimeout(() => el.classList.add('gone'), 1600);
  }, FADE_MS);
}

// ----- Interim paragraph handling (one live paragraph per column) -----
let itInterimEl = null;
let enInterimEl = null;

function setInterim(container, refObj, text) {
  if (!text) {
    if (refObj.el) { refObj.el.remove(); refObj.el = null; }
    return;
  }
  const emptyEl = container.querySelector('.empty');
  if (emptyEl) emptyEl.remove();
  if (!refObj.el) {
    refObj.el = document.createElement('p');
    refObj.el.className = 'para interim';
    container.appendChild(refObj.el);
  }
  refObj.el.textContent = text;
  container.scrollTop = container.scrollHeight;
}
const itInterim = { el: null };
const enInterim = { el: null };

// ----- Chunking for lower-latency speech -----
// Instead of waiting for isFinal (long pauses), we flush when:
//   - interim text ends with sentence punctuation (. ! ? …)
//   - OR interim text passes a word threshold with a comma/clause break
// Each chunk is translated and spoken as soon as it's ready.

let committedItalian = '';   // already translated portion of current utterance
let currentUtterance = '';   // full current interim text
const WORD_THRESHOLD = 10;   // flush clause after this many new words

function countWords(s) { return s.trim().split(/\s+/).filter(Boolean).length; }

function pendingPart() {
  // what's new since last flush
  if (currentUtterance.startsWith(committedItalian)) {
    return currentUtterance.slice(committedItalian.length).trim();
  }
  return currentUtterance.trim();
}

function findFlushPoint(text) {
  // return index AFTER punctuation to flush at, or -1
  const sentenceEnd = text.search(/[.!?…]\s/);
  if (sentenceEnd >= 0) return sentenceEnd + 1;
  if (countWords(text) >= WORD_THRESHOLD) {
    const comma = text.lastIndexOf(',');
    if (comma > 0) return comma + 1;
  }
  return -1;
}

async function flushChunk(chunk) {
  if (!chunk) return;
  // commit Italian paragraph
  addParagraph(itText, chunk, false);
  // translate + speak
  const placeholder = addParagraph(enText, '…', true);
  try {
    const url = 'https://api.mymemory.translated.net/get?q='
      + encodeURIComponent(chunk) + '&langpair=it|en';
    const res = await fetch(url);
    const data = await res.json();
    const en = (data.responseData && data.responseData.translatedText) || '[translation failed]';
    placeholder.textContent = en;
    placeholder.classList.remove('interim');
    scheduleFade(placeholder);
    speak(en);
  } catch (err) {
    placeholder.textContent = '[network error]';
    placeholder.classList.remove('interim');
    scheduleFade(placeholder);
  }
}

function maybeFlush() {
  const pending = pendingPart();
  const point = findFlushPoint(pending);
  if (point > 0) {
    const chunk = pending.slice(0, point).trim();
    const rest = pending.slice(point).trim();
    committedItalian = currentUtterance.slice(0,
      currentUtterance.length - rest.length).trimEnd();
    flushChunk(chunk);
    // update interim display to just the leftover
    setInterim(itText, itInterim, rest);
  } else {
    setInterim(itText, itInterim, pending);
  }
}

// ----- Recognizer -----
let recognition = null;
let listening = false;
let shouldRestart = false;
let baselineIndex = 0; // results[0..baselineIndex) already consumed

function createRecognizer() {
  const r = new SR();
  r.lang = 'it-IT';
  r.continuous = true;
  r.interimResults = true;

  r.onstart = () => {
    baselineIndex = 0;
    committedItalian = '';
    currentUtterance = '';
    setStatus('Listening (waiting for audio)', true);
    const e = document.getElementById('itEmpty'); if (e) e.classList.add('live');
    const e2 = document.getElementById('enEmpty'); if (e2) e2.classList.add('live');
  };
  r.onaudiostart  = () => setStatus('Mic open', true);
  r.onsoundstart  = () => setStatus('Sound detected', true);
  r.onspeechstart = () => setStatus('Speech detected', true);
  r.onspeechend   = () => setStatus('Speech ended', true);
  r.onerror = (e) => {
    const msg = e.error + (e.message ? ' — ' + e.message : '');
    if (e.error === 'no-speech') {
      showError('No speech heard. Check that the correct mic is selected in Chrome (lock icon → Site settings → Microphone) and that macOS has given Chrome mic access (System Settings → Privacy → Microphone).');
    } else if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      showError('Microphone blocked: ' + msg + '. Click the lock icon in the address bar and allow the mic for this site.');
    } else if (e.error === 'network') {
      showError('Network error: speech recognition needs internet. ' + msg);
    } else if (e.error !== 'aborted') {
      showError('Recognition error: ' + msg);
    }
  };
  r.onend = () => {
    setStatus('Reconnecting…', !!shouldRestart);
    if (shouldRestart) {
      try { r.start(); } catch (_) {
        setTimeout(() => { try { r.start(); } catch(_) {} }, 300);
      }
    } else {
      setStatus('Idle', false);
    }
  };
  r.onresult = (ev) => {
    // Only process results from baselineIndex onwards (fixes repeat bug).
    let combined = '';
    for (let i = baselineIndex; i < ev.results.length; i++) {
      combined += ev.results[i][0].transcript + ' ';
    }
    currentUtterance = combined.trim();
    const lastIdx = ev.results.length - 1;
    const finalAtEnd = lastIdx >= baselineIndex && ev.results[lastIdx].isFinal;

    maybeFlush();

    if (finalAtEnd) {
      const rest = pendingPart();
      if (rest) {
        setInterim(itText, itInterim, '');
        flushChunk(rest);
      }
      baselineIndex = ev.results.length;
      committedItalian = '';
      currentUtterance = '';
    }
  };
  return r;
}

toggleBtn.addEventListener('click', () => {
  clearError();
  if (!recognition) recognition = createRecognizer();
  if (!listening) {
    try {
      shouldRestart = true;
      recognition.start();
      listening = true;
      document.getElementById('btnLabel').textContent = 'Stop';
      document.getElementById('btnSvg').innerHTML = '<rect x="6" y="6" width="12" height="12" rx="1"/>';
      toggleBtn.classList.remove('primary');
      toggleBtn.classList.add('stop');
    } catch (err) { showError('Could not start: ' + err.message); }
  } else {
    shouldRestart = false;
    recognition.stop();
    listening = false;
    document.getElementById('btnLabel').textContent = 'Start';
    document.getElementById('btnSvg').innerHTML = '<circle cx="12" cy="12" r="6"/>';
    toggleBtn.classList.add('primary');
    toggleBtn.classList.remove('stop');
  }
});

function resetEmptyStates() {
  const liveClass = listening ? ' live' : '';
  itText.innerHTML = '<div id="itEmpty" class="empty' + liveClass + '"><span class="mic"></span>' +
    (listening ? 'Listening…' : 'Press Start to begin listening') + '</div>';
  enText.innerHTML = '';
}

clearBtn.addEventListener('click', () => {
  itInterim.el = null;
  enInterim.el = null;
  committedItalian = '';
  currentUtterance = '';
  speechSynthesis.cancel();
  resetEmptyStates();
});
</script>
</body>
</html>
